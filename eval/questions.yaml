version: 1

scoring:
  auto_scored: 18 # 1~16, 19, 20
  rubric_scored: 2 # 17, 18
  target: "자동 채점 18문항 중 17문항 이상 (90%)"
  tolerance_by_type:
    count: 0
    ratio: 0.001
    amount: 0.001
    mean: 0.001
  table:
    row_count: exact
    key_columns: exact
    numeric_columns: { integer: 0, float: 0.001 }
    order_sensitive: true
  table_compare: 컬럼명은 채점 대상이 아니다.
  refusal_scoring: >-
    expect_refusal 문항은 숫자를 반환하면 실패. 계산을 시도하지 않고 불가 사유를 밝혀야 통과.

conventions:
  missing_filter: "brand IS NOT NULL AND brand <> ''"
  segment_grain_note: >-
    세그먼트 축이 세션의 속성이면(요일, 시간) 세션 단위 지표를, 상품의 속성이면
    (브랜드, 카테고리) 이벤트 단위 지표를 쓴다. 한 세션에 여러 상품이 섞이므로
    상품 속성은 세션에 귀속시킬 수 없다.
    이벤트 단위 값은 metrics.yaml의 세션 기준 전환율과 다른 수치이므로 응답에 기준을 명시해야 한다.

questions:
  # ── 단순집계 (8) ───────────────────────────────────

  - id: q01
    type: 단순집계
    question: 10월 전체 이벤트 건수는?
    gold_sql: "SELECT COUNT(*) AS n FROM events"
    gold_value: 6610750
    value_type: count
    expect_tool: run_query
    expect_refusal: false

  - id: q02
    type: 단순집계
    question: event_type별 이벤트 건수는?
    gold_sql: |
      SELECT event_type, COUNT(*) AS n
      FROM events
      GROUP BY event_type
      ORDER BY n DESC, event_type
    gold_value:
      - [view, 6379532]
      - [cart, 124252]
      - [purchase, 106966]
    value_type: table
    expect_tool: run_query
    expect_refusal: false

  - id: q03
    type: 단순집계
    question: 10월 총 구매 금액은?
    gold_sql: |
      SELECT SUM(price) AS revenue
      FROM events
      WHERE event_type = 'purchase'
    gold_value: 33297237.63
    note: 수량 컬럼이 없어 purchase 행 1건 = 상품 1개로 계산한다.
    value_type: amount
    expect_tool: run_query
    expect_refusal: false

  - id: q04
    type: 단순집계
    question: 구매 이벤트의 평균 상품 가격은?
    gold_sql: |
      SELECT AVG(price) AS avg_price
      FROM events
      WHERE event_type = 'purchase'
    gold_value: 311.28805068900397
    value_type: amount
    expect_tool: run_query
    expect_refusal: false

  - id: q05
    type: 단순집계
    question: 구매 건수 기준 상위 10개 브랜드는?
    gold_sql: |
      SELECT brand, COUNT(*) AS n
      FROM events
      WHERE event_type = 'purchase'
        AND brand IS NOT NULL AND brand <> ''
      GROUP BY brand
      ORDER BY n DESC, brand
      LIMIT 10
    gold_value:
      - ["samsung", 21953]
      - ["apple", 19048]
      - ["xiaomi", 8098]
      - ["huawei", 3053]
      - ["lucente", 1887]
      - ["lg", 1506]
      - ["oppo", 1412]
      - ["acer", 1189]
      - ["sony", 1099]
      - ["bosch", 1032]
    note: brand 결측 16.2%를 제외한 결과임을 응답에 명시해야 한다.
    value_type: table
    expect_tool: run_query
    expect_refusal: false

  - id: q06
    type: 단순집계
    question: 조회 수 기준 상위 10개 상품은?
    gold_sql: |
      SELECT product_id, COUNT(*) AS n
      FROM events
      WHERE event_type = 'view'
      GROUP BY product_id
      ORDER BY n DESC, product_id
      LIMIT 10
    gold_value:
      - [1004767, 36455]
      - [1004856, 35943]
      - [1005115, 30291]
      - [1005160, 22577]
      - [1004249, 21994]
      - [1004741, 21006]
      - [1004870, 20820]
      - [1004833, 20064]
      - [1002544, 17911]
      - [5100816, 17807]
    value_type: table
    expect_tool: run_query
    expect_refusal: false

  - id: q07
    type: 단순집계
    question: 일자별 구매 건수 추이는?
    gold_sql: |
      SELECT substr(event_time, 1, 10) AS d, COUNT(*) AS n
