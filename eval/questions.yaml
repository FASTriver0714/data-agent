      - ["2019-10-02", 2447]
      - ["2019-10-03", 2659]
      - ["2019-10-04", 3628]
      - ["2019-10-05", 3258]
      - ["2019-10-06", 3052]
      - ["2019-10-07", 2969]
      - ["2019-10-08", 3245]
      - ["2019-10-09", 3314]
      - ["2019-10-10", 3222]
      - ["2019-10-11", 3974]
      - ["2019-10-12", 3853]
      - ["2019-10-13", 4631]
      - ["2019-10-14", 4327]
      - ["2019-10-15", 3887]
      - ["2019-10-16", 4325]
      - ["2019-10-17", 4225]
      - ["2019-10-18", 3957]
      - ["2019-10-19", 3530]
      - ["2019-10-20", 3489]
      - ["2019-10-21", 3569]
      - ["2019-10-22", 3716]
      - ["2019-10-23", 3665]
      - ["2019-10-24", 3570]
      - ["2019-10-25", 3790]
      - ["2019-10-26", 3281]
      - ["2019-10-27", 3303]
      - ["2019-10-28", 3049]
      - ["2019-10-29", 2873]
      - ["2019-10-30", 3030]
      - ["2019-10-31", 2687]
    value_type: table
    expect_tool: run_query
    expect_refusal: false

  - id: q08
    type: 단순집계
    question: 요일별 이벤트 건수는?
    gold_sql: |
      SELECT strftime('%w', event_time) AS dow, COUNT(*) AS n
      FROM events
      GROUP BY dow
      ORDER BY dow
    gold_value:
      - ["0", 924059]
      - ["1", 841972]
      - ["2", 1023926]
      - ["3", 1007875]
      - ["4", 996452]
      - ["5", 923416]
      - ["6", 893050]
    note: "%w는 일요일이 0. 응답에서 숫자를 요일명으로 변환해야 한다."
    value_type: table
    expect_tool: run_query
    expect_refusal: false

  # ── 지표 (5) ──────────────────────────────────────
  # metrics.yaml의 정의와 일치해야 한다. get_metric 결과 대조용.

  - id: q09
    type: 지표
    metric: purchase_conversion_rate
    question: 10월 전체 전환율은?
    gold_sql: |
      SELECT
        CAST(COUNT(DISTINCT CASE WHEN event_type = 'purchase' THEN user_session END) AS REAL)
          / NULLIF(COUNT(DISTINCT user_session), 0) AS cvr
      FROM events
    gold_value: 0.08934582636257223
    value_type: ratio
    expect_tool: get_metric
    expect_refusal: false

  - id: q10
    type: 지표
    metric: cart_to_purchase_rate
    question: 장바구니 담기 대비 구매 전환율은?
    gold_sql: |
      WITH cart AS (
        SELECT user_id, product_id, MIN(event_time) AS first_cart
        FROM events WHERE event_type = 'cart'
        GROUP BY user_id, product_id
      ),
      buy AS (
        SELECT user_id, product_id, MIN(event_time) AS first_purchase
        FROM events WHERE event_type = 'purchase'
        GROUP BY user_id, product_id
      )
      SELECT
        CAST(SUM(CASE WHEN b.first_purchase >= c.first_cart THEN 1 ELSE 0 END) AS REAL)
          / NULLIF(COUNT(*), 0) AS cart_to_purchase_rate
      FROM cart c
      LEFT JOIN buy b ON b.user_id = c.user_id AND b.product_id = c.product_id
    gold_value: 0.4826051493013689
    note: 분모를 cart 이벤트 총합(124,252)으로 잡으면 실패. 예상값 48.26%.
    value_type: ratio
    expect_tool: get_metric
    expect_refusal: false

  - id: q11
    type: 지표
    metric: views_per_session
    question: 세션당 평균 조회 수는?
    gold_sql: |
      SELECT
        CAST(COUNT(*) AS REAL) / NULLIF(COUNT(DISTINCT user_session), 0) AS views_per_session
      FROM events
      WHERE event_type = 'view'
    gold_value: 6.820906006793607
    note: 분모는 전체 세션이 아니라 조회가 있는 세션이다.
    value_type: mean
    expect_tool: get_metric
    expect_refusal: false

  - id: q12
    type: 지표
    metric: revenue_per_buyer
    question: 구매 유저당 평균 구매 금액은?
    gold_sql: |
      SELECT SUM(price) / NULLIF(COUNT(DISTINCT user_id), 0) AS revenue_per_buyer
      FROM events
      WHERE event_type = 'purchase'
    gold_value: 1149.5283308016294
    value_type: amount
    expect_tool: get_metric
    expect_refusal: false

  - id: q13
    type: 지표
    metric: repeat_purchase_rate
    question: 두 번 이상 구매한 유저의 비율은?
    gold_sql: |
      WITH buyer AS (
        SELECT user_id, COUNT(*) AS purchase_count
        FROM events WHERE event_type = 'purchase'
        GROUP BY user_id
      )
      SELECT
        CAST(SUM(CASE WHEN purchase_count >= 2 THEN 1 ELSE 0 END) AS REAL)
          / NULLIF(COUNT(*), 0) AS repeat_purchase_rate
      FROM buyer
    gold_value: 0.5303113995719119
    note: 관측 기간 31일 제약을 응답에 명시해야 한다.
    value_type: ratio
    expect_tool: get_metric
    expect_refusal: false

  # ── 세그먼트 비교 (3) ──────────────────────────────

  - id: q14
    type: 세그먼트
    question: 브랜드 정보가 있는 상품과 없는 상품의 전환율 차이는?
    metric: view_to_purchase_rate
    grain: event
    gold_sql: |
      SELECT
        CASE WHEN brand IS NULL OR brand = '' THEN 'brand_missing' ELSE 'brand_present' END AS seg,
        SUM(CASE WHEN event_type = 'view'     THEN 1 ELSE 0 END) AS views,
        SUM(CASE WHEN event_type = 'purchase' THEN 1 ELSE 0 END) AS purchases,
        CAST(SUM(CASE WHEN event_type = 'purchase' THEN 1 ELSE 0 END) AS REAL)
          / NULLIF(SUM(CASE WHEN event_type = 'view' THEN 1 ELSE 0 END), 0) AS cvr
      FROM events
      GROUP BY seg
      ORDER BY seg
    gold_value:
      - ["brand_missing", 1057644, 10197, 0.009641240341740699]
      - ["brand_present", 5321888, 96769, 0.0181832086657968]
    note: >-
      brand는 상품 속성이므로 세션 단위로 계산할 수 없다. 이벤트 단위 값이며
      metrics.yaml의 세션 기준 전환율과 다른 수치임을 명시해야 한다.
    value_type: table
    expect_tool: run_query
    expect_refusal: false

  - id: q15
    type: 세그먼트
    question: 주중과 주말의 전환율 차이는?
    metric: purchase_conversion_rate
    grain: session
    gold_sql: |
      WITH s AS (
        SELECT user_session,
               MIN(event_time) AS start_time,
               MAX(CASE WHEN event_type = 'purchase' THEN 1 ELSE 0 END) AS bought
        FROM events
        GROUP BY user_session
      )
      SELECT
        CASE WHEN strftime('%w', start_time) IN ('0', '6') THEN 'weekend' ELSE 'weekday' END AS seg,
        COUNT(*) AS sessions,
        SUM(bought) AS buy_sessions,
        CAST(SUM(bought) AS REAL) / NULLIF(COUNT(*), 0) AS cvr
      FROM s
      GROUP BY seg
      ORDER BY seg
    gold_value:
      - ["weekday", 687534, 61157, 0.08895123732062706]
      - ["weekend", 247921, 22422, 0.09044009987052327]
    note: 세션의 첫 이벤트 시각으로 요일을 판정한다. 자정을 넘긴 세션은 시작일 기준.
    rubric:
      - 주중과 주말 전환율을 실제로 계산했는가
      - 차이가 작다는 점을 명시했는가
      - 작은 차이를 유의미한 패턴으로 해석하지 않았는가
    value_type: table
    expect_tool: run_query
    expect_refusal: false

  - id: q16
    type: 세그먼트
    question: 상위 5개 카테고리의 구매 전환율 비교는?
    metric: view_to_purchase_rate
    grain: event
    gold_sql: |
      WITH top5 AS (
        SELECT category_code
        FROM events
        WHERE event_type = 'view'
          AND category_code IS NOT NULL AND category_code <> ''
        GROUP BY category_code
        ORDER BY COUNT(*) DESC, category_code
        LIMIT 5
      )
      SELECT
        e.category_code,
        SUM(CASE WHEN e.event_type = 'view'     THEN 1 ELSE 0 END) AS views,
        SUM(CASE WHEN e.event_type = 'purchase' THEN 1 ELSE 0 END) AS purchases,
        CAST(SUM(CASE WHEN e.event_type = 'purchase' THEN 1 ELSE 0 END) AS REAL)
          / NULLIF(SUM(CASE WHEN e.event_type = 'view' THEN 1 ELSE 0 END), 0) AS cvr
      FROM events e
      JOIN top5 t ON t.category_code = e.category_code
      GROUP BY e.category_code
      ORDER BY views DESC, e.category_code
    gold_value:
      - ["electronics.smartphone", 1419689, 44600, 0.03141533110420663]
      - ["electronics.clocks", 217807, 2925, 0.013429320453428954]
      - ["computers.notebook", 205074, 2672, 0.013029443030320761]
      - ["electronics.video.tv", 159585, 3187, 0.019970548610458376]
      - ["apparel.shoes", 144224, 1002, 0.006947526070556912]
    value_type: table
    expect_tool: run_query
    note: >-
      상위 5개는 조회 수 기준이다. 구매 건수로 상위를 뽑으면 전환율이 높은 카테고리가
      먼저 뽑혀 비교 대상 선정 자체가 편향된다.
      상위 5개 선정과 집계 모두에서 category_code 결측 32.57%를 제외한다.
      결측 category_code는 해당 category_id의 모든 행에서 비어 있어 데이터 내부로
      이름 복구가 불가능하고, 하나의 카테고리로 묶으면 서로 다른 카테고리가 섞이기 때문이다.
      응답에 제외 사실을 명시해야 한다.
    fail_if: 카테고리별 조회 수가 아닌 전체 조회 수를 분모로 사용하는 경우
    expect_refusal: false

  # ── 원인분해 (2) · 루브릭 채점 ──────────────────────

  - id: q17
    type: 원인분해
    question: 10월 중 구매 건수가 가장 낮은 주는 언제이고, 그 감소가 주로 어느 카테고리에서 발생했나?
    gold_sql: null
    reference_sql: |
      SELECT strftime('%W', event_time) AS wk, COUNT(*) AS n
      FROM events WHERE event_type = 'purchase'
      GROUP BY wk ORDER BY n ASC;
      -- 최저 주 식별 후 카테고리 분해
    rubric:
      - 주 단위 구매 건수를 집계해 최저 주를 식별했는가
      - 10월 1일이 화요일이라 첫 주와 마지막 주가 불완전하다는 점을 확인했는가
      - 카테고리 분해 시 category_code 결측 32.6%를 언급했는가
      - 표본이 작은 카테고리를 근거로 결론 내리지 않았는가
      - 원인 특정에는 데이터 밖 정보가 필요함을 명시했는가
      - 단일 월 데이터라 전월 대비·월 단위 코호트 비교가 불가능함을 명시했는가
      - 외부 벤치마크가 없어 절대 수준의 좋고 나쁨은 판단할 수 없음을 명시했는가
    expect_refusal: false

  - id: q18
    type: 원인분해
    question: >-
      오후 시간대(14~17시)는 조회 수가 가장 많지만 구매 전환율은 가장 낮다.
      데이터에서 확인 가능한 요인은 무엇인가?
    gold_sql: null
    reference_sql: 시간대별 조회/구매/전환율 집계 쿼리
    rubric:
      - 시간대별 조회·구매·전환율을 실제로 계산했는가
      - 조회 수 증가가 구매로 이어지지 않는다는 사실을 정확히 서술했는가
      - 세션당 조회 수 등 다른 축으로 분해를 시도했는가
      - 데이터로 확인 불가한 요인을 단정하지 않았는가
    must_mention: [조회 수, 전환율]
    note: >-
      기존 q18(전환율 최저 카테고리 + 조회/장바구니 이탈 지점)을 교체했다. 사유 둘.
      (1) category_code 결측이 event_type별로 24~33%라 원인 분해가 카테고리 자체가 아니라
      데이터 품질 문제로 흐른다.
      (2) '이탈 지점' 표현이 metrics.yaml not_defined의 funnel_step_dropoff와 충돌한다.
      순차 퍼널 전제가 성립하지 않는다고 정의해 둔 것을 문항이 다시 요구하는 셈이었다.
      별도 확인 사항: event_time의 타임존 기준이 원본 CSV·문서 어디에도 명시돼 있지 않다.
      '오후 14~17시'가 어느 지역 기준인지 확정되지 않았으므로, 시간대 해석을 단정하는
      응답은 감점 대상이 아니라 확인 불가로 처리해야 한다.
    expect_refusal: false

  # ── 답할 수 없음 (2) ──────────────────────────────

  - id: q19
    type: 답할수없음
    question: 9월 대비 10월 전환율 변화는?
    gold_sql: null
    expect_refusal: true
    refusal_reason: 데이터가 2019년 10월 단일 월이므로 전월 비교 불가
    fail_if: 숫자를 반환하거나 추정치를 제시하는 경우

  - id: q20
    type: 답할수없음
    question: 카테고리가 미분류된 상품들의 실제 카테고리별 매출 비중은?
    gold_sql: null
    expect_refusal: true
    refusal_reason: >-
      category_code가 빈 category_id는 해당 id의 모든 행에서 비어 있어
      데이터 내부로 이름 복구 불가(확인 쿼리 docs/에 기록).
      category_id로 대체 추정하는 것도 매핑 근거가 없어 불가.
    fail_if:
      추정을 시도하거나 category_id를 근거로 그럴듯한 분배를 제시하는 경우.
      거부하더라도 대체 계산 결과를 한계 설명보다 앞에 배치하는 경우.
